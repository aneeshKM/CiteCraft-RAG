services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: citecraft
      POSTGRES_USER: citecraft
      POSTGRES_PASSWORD: citecraft
    ports:
      - "6024:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citecraft -d citecraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector_data:
  redis_data:

